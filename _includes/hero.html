<section class="hero" id="top">
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="container hero__inner">
    <p class="eyebrow hero__eyebrow" data-hero-fade><span class="eyebrow__dot"></span>{{ page.hero_eyebrow }}</p>

    <h1 class="hero__title">
      {% for line in page.hero_title %}<span class="line"><span{% if line.accent %} class="accent"{% endif %}>{{ line.text }}</span></span>{% endfor %}
    </h1>

    <p class="hero__subtitle" data-hero-fade>{{ page.hero_subtitle }}</p>

    <div class="hero__actions" data-hero-fade>
      <a href="#pour-qui" class="btn btn--primary">
        {{ page.hero_cta_primary }} {{ site.data.icons.arrow }}
      </a>
      <a href="{{ site.data.nav.cta.url }}" class="btn btn--ghost" target="_blank" rel="noopener">{{ site.data.nav.cta.label }}</a>
    </div>
  </div>

  <a href="#pour-qui" class="hero__scroll" aria-label="Faire défiler vers la suite" data-hero-fade>
    <span>Défiler</span>
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </a>
</section>
