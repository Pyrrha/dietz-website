<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090A" />
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />

    <!-- Les animations d'apparition ne s'activent que si le JS est chargé -->
    <script>document.documentElement.classList.add('js');</script>

    <!-- Polices auto-hébergées : pas d'appel à Google, chargement plus rapide -->
    <link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin-700-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="{{ '/assets/fonts/inter-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

    {% seo %}
  </head>

  <body>
    <div class="scroll-progress" aria-hidden="true"><span class="scroll-progress__bar"></span></div>

    <a class="skip-link" href="#main">Aller au contenu</a>

    {% include nav.html %}
    {% include mobile-menu.html %}

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
